<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1日のタスクスケジューラー</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-row">
    <h1 data-i18n="app.title"></h1>
    <label class="lang-switch">
      <span data-i18n="lang.label"></span>
      <select id="lang-select">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
  <p class="lead" id="lead"></p>
</header>

<main class="layout">
  <!-- 入力 -->
  <section class="panel" aria-labelledby="form-heading">
    <h2 id="form-heading" data-i18n="form.heading"></h2>
    <form id="task-form" novalidate>
      <input type="hidden" id="task-id">

      <div class="field">
        <label for="task-name" data-i18n="form.name"></label>
        <input type="text" id="task-name" data-i18n-placeholder="form.namePlaceholder" maxlength="60" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="task-priority"><span data-i18n="form.priority"></span><span class="hint" data-i18n="form.priorityHint"></span></label>
          <input type="number" id="task-priority" min="1" max="99" step="1" value="1" required>
        </div>
        <div class="field">
          <label for="task-duration"><span data-i18n="form.duration"></span><span class="hint" data-i18n="form.durationHint"></span></label>
          <input type="number" id="task-duration" min="5" step="5" value="60" required>
        </div>
      </div>

      <p class="error" id="form-error" role="alert" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn primary" id="submit-btn"></button>
        <button type="button" class="btn ghost" id="cancel-btn" data-i18n="common.cancel" hidden></button>
      </div>
    </form>

    <div class="summary" id="summary" aria-live="polite"></div>
  </section>

  <!-- タスク一覧 -->
  <section class="panel" aria-labelledby="list-heading">
    <div class="panel-head">
      <h2 id="list-heading" data-i18n="list.heading"></h2>
      <div class="head-actions">
        <button type="button" class="btn ghost" id="clear-planning-btn"
          data-i18n="list.clearPlanning" data-i18n-title="list.clearPlanningTitle"></button>
        <button type="button" class="btn ghost danger" id="clear-btn" data-i18n="list.clearAll"></button>
      </div>
    </div>
    <ul class="task-list" id="task-list"></ul>
    <p class="empty" id="list-empty" data-i18n="list.empty"></p>
  </section>

  <!-- スケジュール -->
  <section class="panel wide" aria-labelledby="schedule-heading">
    <div class="panel-head">
      <h2 id="schedule-heading"></h2>
      <p class="empty" data-i18n="schedule.hint"></p>
    </div>
    <div class="timeline" id="timeline" aria-hidden="true"></div>
    <div class="table-scroll">
      <table class="schedule" id="schedule-table">
        <thead>
          <tr>
            <th scope="col"><span class="sr-only" data-i18n="board.dragTitle"></span></th>
            <th scope="col" data-i18n="schedule.colTime"></th>
            <th scope="col" data-i18n="schedule.colPriority"></th>
            <th scope="col" data-i18n="schedule.colName"></th>
            <th scope="col" data-i18n="schedule.colDuration"></th>
            <th scope="col" data-i18n="schedule.colAdd"></th>
          </tr>
        </thead>
        <tbody id="schedule-body"></tbody>
      </table>
    </div>
  </section>

  <!-- 手動スケジュール（ドラッグ＆ドロップ） -->
  <section class="panel wide" aria-labelledby="board-heading">
    <div class="panel-head">
      <h2 id="board-heading" data-i18n="board.heading"></h2>
      <div class="head-actions">
        <div class="week-nav">
          <button type="button" class="btn ghost btn-small" id="prev-week" data-i18n="board.prev" data-i18n-aria="board.prevAria"></button>
          <button type="button" class="btn ghost btn-small" id="this-week" data-i18n="board.this"></button>
          <button type="button" class="btn ghost btn-small" id="next-week" data-i18n="board.next" data-i18n-aria="board.nextAria"></button>
        </div>
        <button type="button" class="btn ghost danger" id="clear-placements" data-i18n="board.clearPlacements"></button>
      </div>
    </div>
    <p class="week-label" id="week-label"></p>
    <p class="empty" data-i18n="board.note"></p>

    <form class="event-form" id="event-form" novalidate>
      <input type="hidden" id="event-id">
      <div class="field">
        <label for="event-name" data-i18n="event.name"></label>
        <input type="text" id="event-name" data-i18n-placeholder="event.namePlaceholder" maxlength="40" required>
      </div>
      <div class="field">
        <label for="event-day" data-i18n="event.day"></label>
        <select id="event-day"></select>
      </div>
      <div class="field">
        <label for="event-start" data-i18n="event.start"></label>
        <select id="event-start"></select>
      </div>
      <div class="field">
        <label for="event-duration" data-i18n="event.duration"></label>
        <input type="number" id="event-duration" min="5" step="5" value="60" required>
      </div>
      <div class="event-actions">
        <button type="submit" class="btn primary btn-small" id="event-submit"></button>
        <button type="button" class="btn ghost btn-small" id="event-cancel" data-i18n="common.cancel" hidden></button>
      </div>
    </form>
    <div class="table-scroll">
      <table class="schedule board" id="board-table">
        <thead>
          <tr id="board-head"></tr>
        </thead>
        <tbody id="board-body"></tbody>
      </table>
    </div>
    <p class="empty" id="board-status" role="status" aria-live="polite"></p>
  </section>

  <!-- Excel出力・取り込み -->
  <section class="panel wide" aria-labelledby="excel-heading">
    <div class="panel-head">
      <h2 id="excel-heading" data-i18n="excel.heading"></h2>
      <div class="export-actions">
        <div class="export-range" role="radiogroup" data-i18n-aria="excel.rangeAria">
          <label><input type="radio" name="export-range" value="day" checked> <span data-i18n="excel.day"></span></label>
          <label><input type="radio" name="export-range" value="week"> <span data-i18n="excel.week"></span></label>
          <label><input type="radio" name="export-range" value="all"> <span data-i18n="excel.all"></span></label>
        </div>
        <select id="export-day" data-i18n-aria="excel.dayAria"></select>
        <button type="button" class="btn primary" id="download-btn" data-i18n="excel.download"></button>
        <label class="btn ghost file-btn" for="import-file" data-i18n="excel.import"></label>
        <input type="file" id="import-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden>
      </div>
    </div>
    <p class="empty" data-i18n="excel.note"></p>
    <div class="table-scroll">
      <table class="schedule preview" id="export-preview">
        <thead>
          <tr>
            <th scope="col" data-i18n="excel.colKind"></th>
            <th scope="col" data-i18n="excel.colDay"></th>
            <th scope="col" data-i18n="excel.colDate"></th>
            <th scope="col" data-i18n="excel.colStart"></th>
            <th scope="col" data-i18n="excel.colEnd"></th>
            <th scope="col" data-i18n="excel.colName"></th>
            <th scope="col" data-i18n="excel.colPriority"></th>
            <th scope="col" data-i18n="excel.colDuration"></th>
          </tr>
        </thead>
        <tbody id="export-body"></tbody>
      </table>
    </div>
    <p class="empty" id="export-status" role="status" aria-live="polite"></p>
  </section>

  <!-- 月間カレンダー -->
  <section class="panel wide" aria-labelledby="calendar-heading">
    <div class="panel-head">
      <h2 id="calendar-heading" data-i18n="calendar.heading"></h2>
      <div class="week-nav">
        <button type="button" class="btn ghost btn-small" id="prev-month" data-i18n="calendar.prev" data-i18n-aria="calendar.prevAria"></button>
        <button type="button" class="btn ghost btn-small" id="this-month" data-i18n="calendar.this"></button>
        <button type="button" class="btn ghost btn-small" id="next-month" data-i18n="calendar.next" data-i18n-aria="calendar.nextAria"></button>
      </div>
    </div>
    <p class="week-label" id="calendar-label"></p>
    <p class="empty" data-i18n="calendar.note"></p>
    <div class="calendar" id="calendar">
      <div class="calendar-head" id="calendar-head"></div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
    <p class="empty" id="calendar-status" role="status" aria-live="polite"></p>
  </section>

</main>

<!-- 日単位のExcelを取り込む曜日を選ぶダイアログ -->
<dialog id="import-dialog" class="conflict" aria-labelledby="import-heading">
  <h2 id="import-heading" data-i18n="import.heading"></h2>
  <p id="import-message"></p>
  <div class="field">
    <label for="import-day" data-i18n="import.dayLabel"></label>
    <select id="import-day"></select>
  </div>
  <div class="conflict-foot">
    <button type="button" class="btn ghost" id="import-cancel" data-i18n="common.cancel"></button>
    <button type="button" class="btn primary" id="import-confirm" data-i18n="import.confirm"></button>
  </div>
</dialog>

<!-- 優先順位の重複時に比較して選ぶダイアログ -->
<dialog id="conflict-dialog" class="conflict" aria-labelledby="conflict-heading">
  <h2 id="conflict-heading" data-i18n="conflict.heading"></h2>
  <p id="conflict-message"></p>
  <div class="conflict-options">
    <button type="button" class="conflict-option" id="choose-moving"></button>
    <button type="button" class="conflict-option" id="choose-existing"></button>
  </div>
  <div class="conflict-foot">
    <button type="button" class="btn ghost" id="conflict-cancel" data-i18n="common.cancel"></button>
  </div>
</dialog>

<script src="i18n.js"></script>
<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
